apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/description: >
      Requires all containers to define CPU and memory limits.
      Prevents noisy neighbor issues and unbounded resource consumption.
spec:
  # audit = report violations without blocking. Change to enforce to block.
  validationFailureAction: audit
  background: true
  rules:
    - name: check-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must define resources.limits for cpu and memory."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
