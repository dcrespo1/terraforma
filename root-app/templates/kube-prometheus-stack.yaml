{{- if .Values.apps.kubePrometheusStack.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Sync waves control ordering — lower numbers sync first.
    # Operators and CRDs should use wave 1 so they're ready before
    # anything that depends on their CRDs (wave 2+).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # Cascade delete — removing this Application also removes its workloads.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      valuesObject:
        # These components don't run as in-cluster pods in kind —
        # disabling prevents broken ServiceMonitors and sync warnings.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: {{ .Values.global.destination.server }}
    namespace: {{ .Values.apps.kubePrometheusStack.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
